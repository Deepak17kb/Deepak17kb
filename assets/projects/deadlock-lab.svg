<svg xmlns="http://www.w3.org/2000/svg" width="440" height="262" viewBox="0 0 440 262" role="img" aria-label="Deadlock Runtime Lab — A resource-allocation graph you can run: a deterministic scheduler exposes contention and DFS finds the deadlock. Built with React 19, Vite, Express 5, SQLite."><title>Deadlock Runtime Lab — A resource-allocation graph you can run: a deterministic scheduler exposes contention and DFS finds the deadlock. Built with React 19, Vite, Express 5, SQLite.</title><style>text{font-kerning:normal}.comet{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:90 910;animation:comet 10s linear infinite}.halo{stroke-width:7;opacity:.22}@keyframes comet{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite both}@keyframes ping{0%{transform:scale(1);opacity:.8}70%,100%{transform:scale(3.2);opacity:0}}.blink{animation:blink 1.05s steps(1) infinite}@keyframes blink{50%{opacity:0}}.scan{animation:scan 9s linear infinite}@keyframes scan{from{transform:translateY(0)}to{transform:translateY(900px)}}.glow{animation:glow 6s ease-in-out infinite}@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}.draw{stroke-dasharray:1 1;animation:draw 7s cubic-bezier(.5,0,.2,1) infinite both}@keyframes draw{0%{stroke-dashoffset:1}40%{stroke-dashoffset:0}88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}.fade{animation:fade 7s ease infinite both}@keyframes fade{0%,30%{opacity:0}45%,88%{opacity:1}100%{opacity:0}}.pop{transform-box:fill-box;transform-origin:center;animation:pop 7s ease infinite both}@keyframes pop{0%,38%{transform:scale(0)}44%{transform:scale(1.4)}48%,88%{transform:scale(1);opacity:1}100%{opacity:0}}.grow{transform-box:fill-box;transform-o