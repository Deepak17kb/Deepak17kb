;animation:grow 7s cubic-bezier(.3,.7,.2,1) infinite both}@keyframes grow{0%{transform:scaleY(0)}25%,88%{transform:scaleY(1);opacity:1}100%{opacity:0}}.hold{animation:hold 7s infinite both}@keyframes hold{0%,88%{opacity:1}100%{opacity:0}}</style><defs><clipPath id="card-clip"><rect width="440" height="262" rx="20"/></clipPath><radialGradient id="card-glow"><stop offset="0" stop-color="#5CF2B0" stop-opacity=".22"/><stop offset="1" stop-color="#5CF2B0" stop-opacity="0"/></radialGradient><clipPath id="band"><rect width="392" height="68" rx="10"/></clipPath></defs><rect width="440" height="262" rx="20" fill="#0A0A13"/><g clip-path="url(#card-clip)"><circle cx="410" cy="10" r="210" fill="url(#card-glow)" class="glow"/><rect x="24" y="22" width="44" height="44" rx="12" fill="#5CF2B0" fill-opacity=".1" stroke="#5CF2B0" stroke-opacity=".45"/><path transform="translate(46,44)" d="M0,10V-1M0,3C-8,3 -9,-5 -9,-7C-3,-7 0,-4 0,3M0,-1C0,-7 4,-10 9,-10C9,-4 5,-1 0,-1" fill="none" stroke="#5CF2B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="38" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'SF Mono',Menlo,monospace" font-size="10.5" fill="#5CF2B0" textLength="113.4" lengthAdjust="spacing" xml:space="preserve">DATA · FORECASTING</text><text x="84" y="61" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Inter,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#ECECF4">AgriFlow AI</text><rect x="360" y="26" width="56" height="22" rx="11" fill="#0E0E1A" stroke="#1E1E30"/><circle cx="372" cy="37" r="3" fill="#5CF2B0" opacity="0" class="ping"/><circle cx="372" cy="37" r="3" fill="#5CF2B0"/><text x="381" y="40.5" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'SF Mono',Menlo,monospace" font-size="10" fill="#A9A9C2" textLength="24" lengthAdjust="spacing" xml:space="preserve">LIVE</text><g transform="translate(24,80)"><rect width="392" height="68" rx="10" fill="#0E0E1A" stroke="#1E1