row 7s cubic-bezier(.3,.7,.2,1) infinite both}@keyframes grow{0%{transform:scaleY(0)}25%,88%{transform:scaleY(1);opacity:1}100%{opacity:0}}.hold{animation:hold 7s infinite both}@keyframes hold{0%,88%{opacity:1}100%{opacity:0}}</style><defs><clipPath id="card-clip"><rect width="440" height="262" rx="20"/></clipPath><radialGradient id="card-glow"><stop offset="0" stop-color="#FFC069" stop-opacity=".22"/><stop offset="1" stop-color="#FFC069" stop-opacity="0"/></radialGradient><clipPath id="band"><rect width="392" height="68" rx="10"/></clipPath></defs><rect width="440" height="262" rx="20" fill="#0A0A13"/><g clip-path="url(#card-clip)"><circle cx="410" cy="10" r="210" fill="url(#card-glow)" class="glow"/><rect x="24" y="22" width="44" height="44" rx="12" fill="#FFC069" fill-opacity=".1" stroke="#FFC069" stroke-opacity=".45"/><path transform="translate(46,44)" d="M-8,-8H8A3,3 0 0 1 11,-5V2A3,3 0 0 1 8,5H-1L-6,9V5H-8A3,3 0 0 1 -11,2V-5A3,3 0 0 1 -8,-8ZM-5,-1.5H-4.5M0,-1.5H0.5M5,-1.5H5.5" fill="none" stroke="#FFC069" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="38" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'SF Mono',Menlo,monospace" font-size="10.5" fill="#FFC069" textLength="107.1" lengthAdjust="spacing" xml:space="preserve">GEN AI · AGRITECH</text><text x="84" y="61" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Inter,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#ECECF4">KrishiMitra</text><rect x="360" y="26" width="56" height="22" rx="11" fill="#0E0E1A" stroke="#1E1E30"/><circle cx="372" cy="37" r="3" fill="#6A6A80"/><text x="381" y="40.5" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'SF Mono',Menlo,monospace" font-size="10" fill="#A9A9C2" textLength="24" lengthAdjust="spacing" xml:space="preserve">CODE</text><g transform="translate(24,80)"><rect width="392" height="68" rx="10" fill="#0E0E1A" stroke="#1E1E30"/><g clip-path="url(#band)"><style>.u{